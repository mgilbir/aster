name: CI

# The quick gates, on every pull request (stacked ones included) and every
# push to main: formatting, lint, vet, the -short suite, 32-bit, windows and
# darwin builds, the FMA and recursion audits. They take a few minutes. The slow gates (race,
# oracle, PDFium, macOS, 32-bit tests, benchmarks) are in heavy.yml, which
# runs on main and by hand before a release; run them locally with
# `make check` and `make benchgate` before merging.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: go mod tidy
        run: go mod tidy -diff

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # macOS: heavy.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -short
        run: go test -short -timeout 30m ./...

  build-32bit:
    # int is 32 bits on 386 and arm: what does not compile there, or what
    # overflows in a size or budget check, shows only on such a target.
    # The tests run on 386 in heavy.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: GOARCH=386 go build ./...
      - name: go vet
        # compiles the tests too
        run: GOARCH=386 go vet ./...

  cross-build:
    # What builds on linux need not on windows or darwin (a unix-only
    # syscall in a tool or a test helper): build and vet, tests included,
    # for both. Nothing runs; heavy.yml's macOS job runs darwin's tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: windows
        run: GOOS=windows go build ./... && GOOS=windows go vet ./...
      - name: darwin
        run: GOOS=darwin go build ./... && GOOS=darwin go vet ./...

  fmacheck:
    # The engine must not let the compiler fuse multiply-adds where upstream
    # (V8) rounds each product; the script cross-compiles for arm64 on any host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/fmacheck.sh
      - name: recursion audit
        run: go run ./internal/cmd/recursionaudit
