name: Fuzz

# Coverage-guided fuzzing (go test -fuzz) of the parsers, nightly, and the
# Vega-Lite type-confusion differential against node (job typeconfusion). The targets
# and the minutes each one gets are listed in scripts/fuzz-targets.txt; the
# matrix is built from that file, so a new target is added there only. Each
# target keeps the inputs the fuzzer found interesting between runs in the
# actions cache, so a night starts where the last one stopped.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "-fuzztime for every target (e.g. 30s); empty runs the minutes listed in scripts/fuzz-targets.txt"
        required: false
        default: ""
      seed:
        description: "seed of the type-confusion differential; empty uses the day number"
        required: false
        default: ""
      typeconfusion_budget:
        description: "time the type-confusion differential searches for (e.g. 10m)"
        required: false
        default: "40m"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: |
          matrix=$(scripts/fuzz.sh -list | jq -R -s -c '{include: (split("\n") | map(select(length > 0) | split("\t")
            | {pkg: .[0], target: .[1], minutes: .[2], key: ((.[0] | ltrimstr("./") | gsub("/"; "-")) + "-" + .[1])}))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    name: ${{ matrix.pkg }} ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # the build cache is the fuzz corpus's neighbour in GOCACHE; the corpus is cached on its own below
          cache: false
      - id: dir
        run: echo "fuzz=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.dir.outputs.fuzz }}
          # cache keys are immutable: each run saves under a new key and the next one restores the latest
          key: fuzz-${{ matrix.key }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.key }}-
      - name: go test -fuzz
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime || format('{0}m', matrix.minutes) }}
        run: scripts/fuzz.sh -one "$PKG" "$TARGET"
      - uses: actions/cache/save@v6
        # a failing run still found inputs worth keeping
        if: always()
        with:
          path: ${{ steps.dir.outputs.fuzz }}
          key: fuzz-${{ matrix.key }}-${{ github.run_id }}
      - name: collect the crashers
        if: failure()
        run: |
          mkdir "$RUNNER_TEMP/crashers"
          git ls-files --others --exclude-standard -z -- '*/testdata/fuzz/*' | xargs -0 -r cp --parents -t "$RUNNER_TEMP/crashers"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: crashers-${{ matrix.key }}
          path: ${{ runner.temp }}/crashers
          if-no-files-found: ignore

  typeconfusion:
    # The type-confusion differential (TestVegaLiteTypeConfusionMatchesNode)
    # as a continuous search: each night a new seed, as many mutants as the
    # budget allows, against node with a cold oracle cache (no answer is
    # reused, so every one is a fresh upstream compilation). A difference
    # fails the job and the first mutant of each is uploaded; docs/testing.md
    # describes how one becomes a regression case.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          # node 24, as pinned for the oracle (volta)
          node-version-file: testdata/oracle-node/package.json
      - name: install the oracle
        run: |
          (cd testdata/oracle-node && npm ci)
          (cd testdata/oracle-node-vl5 && npm ci)
      - id: seed
        # The seed rotates by day; a manual run can name one.
        env:
          SEED: ${{ inputs.seed }}
        run: echo "seed=${SEED:-$(( $(date -u +%s) / 86400 ))}" >> "$GITHUB_OUTPUT"
      - name: differential
        env:
          ASTER_ORACLE: require
          SEED: ${{ steps.seed.outputs.seed }}
          BUDGET: ${{ inputs.typeconfusion_budget || '40m' }}
        run: |
          mkdir -p "$RUNNER_TEMP/typeconfusion"
          go test -count=1 -v -timeout 55m -run 'TestVegaLiteTypeConfusionMatchesNode$' . \
            -args -typeconfusion.seed "$SEED" -typeconfusion.n 100000000 -typeconfusion.budget "$BUDGET" \
            -typeconfusion.dump "$RUNNER_TEMP/typeconfusion"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: typeconfusion-seed-${{ steps.seed.outputs.seed }}
          path: ${{ runner.temp }}/typeconfusion
          if-no-files-found: ignore
